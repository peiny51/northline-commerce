services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: outdoor
      POSTGRES_PASSWORD: outdoor
      POSTGRES_DB: northline_django
    ports:
      - "5545:5432"
    volumes:
      - northline_django_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outdoor -d northline_django"]
      interval: 5s
      timeout: 3s
      retries: 12
  qdrant:
    image: qdrant/qdrant:v1.15.5
    ports:
      - "6334:6333"
    volumes:
      - northline_django_qdrant:/qdrant/storage
  redis:
    image: redis:7-alpine
    ports:
      - "6381:6379"
volumes:
  northline_django_postgres:
    external: true
    name: northline-django-commerce_northline_django_postgres
  northline_django_qdrant:
